amcl:
  ros__parameters:
    use_sim_time: False
    # 运动模型噪声: alpha1-4 是平移/旋转间的耦合噪声, alpha5 在 nav2 OmniMotionModel
    # 里专门刻画"侧向滑移噪声". Go1 全向但绝大多数任务靠纵向行走, 侧向命令稀少,
    # 当 TEB 偶尔下发 vy 指令时腿足实际侧滑量级 (cm 级) 比纯差速底盘大得多, 故
    # alpha5 提到 0.5 (默认 0.2 偏低) 让粒子方差更宽松, 避免 AMCL 对 vy 指令"反应过度".
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.5
    base_frame_id: "body"          # <--- 修改：机器狗基座
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_beams: 60
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "camera_init"   # <--- 修改：FAST_LIO 的里程计帧
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"   # Humble 下的全向模型类名 (非 Omnidirectional*)
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true             # AMCL 负责发布 map -> camera_init 的 TF
    transform_tolerance: 0.3       # TF 容忍延迟 (秒); 1.0 太大，0.3m/s下=9cm位置误差
    updater_error: 0.01
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: body
    odom_topic: /Odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    # 默认行为树插件配置... (使用默认即可，略去部分冗长配置，ROS2会加载默认值)
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667

controller_server:
  ros__parameters:
    use_sim_time: False
    odom_topic: /Odometry
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    # 进度检查器
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    # 目标检查器
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    
    # 控制器算法 (TEB - 时间弹性带局部规划器，适合全向机器人)
    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"

      # === 轨迹优化参数 ===
      # teb_autosize: 在此 teb_local_planner 分支里声明为 double (而非 bool)，
      # 作为"时间分辨率的放大因子"：0.0=禁用自动调整, 1.0=默认启用
      # 传 true/false 会被 ROS2 参数系统拒绝并导致 controller_server lifecycle configure 失败
      teb_autosize: 1.0               # 自动调整时间分辨率 (1.0 = 启用)
      dt_ref: 0.3                     # 期望的轨迹时间分辨率 (秒)
      dt_hysteresis: 0.1              # 时间分辨率滞环阈值
      max_samples: 500                # 最大采样数
      global_plan_overwrite_orientation: true
      allow_init_with_backwards_motion: true
      max_global_plan_lookahead_dist: 3.0  # 全局路径前瞻距离 (米)
      global_plan_viapoint_sep: -1.0
      global_plan_prune_distance: 1.0
      exact_arc_length: false
      feasibility_check_no_poses: 5
      publish_feedback: false

      # === 全向机器人运动学参数 ===
      # 当前值为"首次部署保守配置"，稳定运行后可上调 (见实验手册 §10.4)
      #   激进配置参考: max_vel_x=0.4, max_vel_y=0.3, max_vel_theta=1.0
      max_vel_x: 0.3                  # X轴最大线速度 (米/秒)
      max_vel_x_backwards: 0.15       # 后退最大线速度
      max_vel_y: 0.2                  # Y轴最大线速度 (全向机器人必须 > 0)
      max_vel_theta: 0.7              # 最大角速度 (弧度/秒)
      acc_lim_x: 0.8                  # X轴加速度限制 (四足步态安全范围)
      acc_lim_y: 0.8                  # Y轴加速度限制 (全向)
      acc_lim_theta: 1.5              # 角加速度限制

      # === 机器人足迹模型 ===
      # Go1 外形约 0.65m(长) × 0.28m(宽)，用圆近似需取外接圆一半 ≈0.35m
      # 取 0.32m 兼顾安全余量与通过性 (门宽通常 ≥0.8m)
      footprint_model.type: "circular"
      footprint_model.radius: 0.32

      # === 障碍物参数 ===
      min_obstacle_dist: 0.30         # 与障碍物最小距离 (m)
      inflation_dist: 0.55            # 膨胀距离 (略大于 min_obstacle_dist)
      include_costmap_obstacles: true
      costmap_obstacles_behind_robot_dist: 1.5
      obstacle_poses_affected: 15
      dynamic_obstacle_inflation_dist: 0.6
      include_dynamic_obstacles: true

      # === 全向机器人标志 (必须为 true) ===
      holonomic_robot: true

      # === 优化权重参数 ===
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: true
      optimization_verbose: false
      penalty_epsilon: 0.1
      # obstacle_cost_exponent=1.0 线性惩罚 (默认)；=4.0 四次方激进避障但易卡死
      # 首次部署用 1.0，若出现"擦碰障碍"再调到 2.0-4.0
      # 必须写为浮点 (1.0)，TEB 声明此参数为 double；写成 1 会被拒绝
      obstacle_cost_exponent: 1.0
      weight_max_vel_x: 2.0
      weight_max_vel_y: 2.0           # 全向: Y轴速度权重
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_y: 1.0           # 全向: Y轴加速度权重
      weight_acc_lim_theta: 1.0
      weight_kinematics_nh: 0.0       # 全向机器人设为 0 (非完整约束权重)
      weight_kinematics_forward_drive: 1.0
      weight_kinematics_turning_radius: 0.0  # 全向机器人无最小转弯半径
      weight_optimaltime: 1.0         # 时间最优权重
      weight_shortest_path: 0.0
      # weight_obstacle=50 中等偏好避障；=100+ 可能导致狭窄通道无法通过
      weight_obstacle: 50.0
      weight_inflation: 0.2
      weight_dynamic_obstacle: 10.0
      weight_dynamic_obstacle_inflation: 0.2
      weight_viapoint: 1.0
      weight_adapt_factor: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: camera_init    # <--- 修改：局部地图基于里程计帧
      robot_base_frame: body       # <--- 修改
      use_sim_time: False
      rolling_window: true
      # TEB 前瞻为 3.0m, 4x4m 窗口半径只有 2m, 实机容易在转角处看不全局部障碍.
      # 5x5m 在 0.05m 分辨率下仍只有 100x100 栅格, 对 Jetson 负担可控.
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.32           # Go1 外接圆半径 (需与 TEB footprint_model.radius 一致)
      transform_tolerance: 0.5
      # /scan 是 pointcloud_to_laserscan 生成的 2D LaserScan. 实机测试发现 VoxelLayer
      # 会把 scan 原点的 z=-0.07m 左右视为低于 origin_z=0.0, 导致持续
      # "Sensor origin ... is out of map bounds" 并影响 raytrace. 这里改用
      # 2D ObstacleLayer: 局部避障仍使用实时 /scan, 但不再引入体素高度边界。
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
          inf_is_valid: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: body       # <--- 修改
      use_sim_time: False
      robot_radius: 0.32           # 与 local_costmap 一致
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.5
      # 全局规划优先依赖已建静态地图, 避免实机短 demo 中实时 /scan 噪声或
      # TF 抖动把全局路径直接判死; 动态障碍交给 local_costmap + TEB 做局部避让。
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "my_lab.yaml" # 这个稍后在 launch 文件里会覆盖

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: camera_init
    robot_base_frame: body
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    # 恢复行为也会直接发 cmd_vel, 必须与 TEB / velocity_smoother 的保守限速一致.
    max_rotational_vel: 0.7
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    # Humble nav2_bringup 会将 controller_server 的 cmd_vel remap 到 cmd_vel_nav,
    # 再由 velocity_smoother 将 cmd_vel_smoothed remap 回 /cmd_vel. 因此 smoother
    # 是实机控制链路的一部分, 这里必须显式保持与 TEB 一致的全向速度/加速度限制.
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"            # 不依赖 10Hz FAST-LIO 速度反馈, 避免延迟引入振荡
    max_velocity: [0.3, 0.2, 0.7]
    min_velocity: [-0.15, -0.2, -0.7]
    max_accel: [0.8, 0.8, 1.5]
    max_decel: [-0.8, -0.8, -1.5]
    odom_topic: /Odometry
    odom_duration: 0.3
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
