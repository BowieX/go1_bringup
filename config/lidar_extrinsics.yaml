# =============================================================================
# LiDAR -> body 外参 (单一数据源)
#
# go1_base.launch.py 与 go1_replay.launch.py 都从此文件读取, 修改一次两边同步生效.
#
# 测量约定 (ROS REP-103, X 前 / Y 左 / Z 上, 详见实验手册 §4.5):
#   body        = 机器狗腰部几何中心 (四腿投影中心), FAST-LIO 位姿输出帧
#   livox_frame = MID-360S 外壳底部 (Livox 手册标注的传感器坐标系原点)
#   x 正值 = LiDAR 在机体前方; y 正值 = 在左侧; z 正值 = 在上方
#
# 当前默认值 (实测于 2026-04-17):
#   x = 0.008  m  — LiDAR 在机身前方 8 mm
#   y = 0.000  m  — 居中, 无左右偏移
#   z = 0.2742 m  — LiDAR 外壳底部比腰部中心高 274.2 mm
#   roll/pitch/yaw = 0  — 安装水平
# =============================================================================
lidar_extrinsics:
  x: 0.008
  y: 0.000
  z: 0.2742
  roll:  0.0
  pitch: 0.0
  yaw:   0.0
  parent_frame: body
  child_frame:  livox_frame
