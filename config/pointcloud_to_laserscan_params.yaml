pointcloud_to_laserscan:
  ros__parameters:
    target_frame: body
    transform_tolerance: 0.2  # 建议改为 0.2 (200ms)
    min_height: -0.1
    max_height: 0.5
    # 角度范围: 排除机体正后方60°扇区以过滤跟随操作者的干扰
    # 完整圆周为 -π ~ +π，排除后方 ±30° 即保留 -150° ~ +150°
    # LiDAR坐标系: X正=前方, 角度0=正前方, ±π=正后方
    angle_min: -2.618  # -150° = -5π/6
    angle_max: 2.618   # +150° = +5π/6
    angle_increment: 0.0087 # M_PI/360.0
    scan_time: 0.1
    range_min: 0.1
    range_max: 100.0
    use_inf: true
    inf_epsilon: 1.0

    # 关键部分：QoS 配置
    # 0 = System Default, 1 = Reliable, 2 = Best Effort
    qos_reliability: 1
    qos_durability: 2 # 2 = Volatile
