pointcloud_to_laserscan:
  ros__parameters:
    target_frame: body
    transform_tolerance: 0.2  # 建议改为 0.2 (200ms)
    min_height: -0.1
    max_height: 0.5
    # 角度范围: 排除机体正后方扇区以过滤跟随操作者的干扰
    # 完整圆周为 -π ~ +π，排除后方 ±40° 即保留 -140° ~ +140°
    # (需与 FAST_LIO mid360.yaml 的 tail_fov_half_angle 保持一致)
    # LiDAR坐标系: X正=前方, 角度0=正前方, ±π=正后方
    angle_min: -2.443  # -140° ≈ -7π/9 (靠近跟随: 扩大后方盲区到 ±40°)
    angle_max: 2.443   # +140°
    # 4.886 / 0.00872 ≈ 560 束/扫描, 够 Nav2 AMCL 的 likelihood_field 使用.
    # (历史说明: 此处选 0.00872 原本是为了兼容 slam_toolbox 的 round 取整
    # 约定, 项目 2026-04 改用 FAST-LIO PCD 切片建图后 slam_toolbox 已完全移除,
    # 但 AMCL 对该值无特殊要求, 保留现值即可.)
    angle_increment: 0.00872
    scan_time: 0.1
    range_min: 0.1
    range_max: 100.0
    use_inf: true
    inf_epsilon: 1.0

    # 关键部分：QoS 配置
    # 0 = System Default, 1 = Reliable, 2 = Best Effort
    qos_reliability: 1
    qos_durability: 2 # 2 = Volatile
