pointcloud_to_laserscan:
  ros__parameters:
    target_frame: body
    transform_tolerance: 0.2  # 建议改为 0.2 (200ms)
    min_height: -0.1
    max_height: 0.5
    angle_min: -3.14159 # -M_PI
    angle_max: 3.14159  # M_PI
    angle_increment: 0.0087 # M_PI/360.0
    scan_time: 0.1
    range_min: 0.1
    range_max: 100.0
    use_inf: true
    inf_epsilon: 1.0

    # 关键部分：QoS 配置
    # 0 = System Default, 1 = Reliable, 2 = Best Effort
    qos_reliability: 1
    qos_durability: 2 # 2 = Volatile
